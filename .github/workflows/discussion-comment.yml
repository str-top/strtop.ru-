name: Discussion Comment on Edit

on:
  discussion_comment:
    types: [edited]

jobs:
  add-comment:
    runs-on: ubuntu-latest
    if: github.event.action == 'edited'
    
    permissions:
      discussions: write
      pull-requests: read
      issues: read
      contents: read
      
    steps:
      - name: Add comment to discussion
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          body: |
            ---
            
            📝 **Comment was edited**
            
            This comment was modified on ${{ github.event.comment.updated_at }}.
            
            *Original author: @${{ github.event.comment.user.login }}*
            *Edited by: @${{ github.actor }}*
            
            > 💡 This is an automated comment added when discussion messages are edited.
          reaction-type: eyes
