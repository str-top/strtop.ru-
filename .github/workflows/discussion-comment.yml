name: Discussion Comment on Edit

on:
  discussion:
    types: [edited]
  discussion_comment:
    types: [edited]

jobs:
  add-comment:
    runs-on: ubuntu-latest
    if: github.event.action == 'edited'
    
    permissions:
      discussions: write
      pull-requests: read
      issues: read
      contents: read
      actions: read
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for previous comment snapshots
        id: check-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const found = data.artifacts?.find(artifact => artifact.name === 'discussion-comments' && !artifact.expired);
            core.setOutput('exists', found ? 'true' : 'false');
            if (found) {
              core.info(`Found existing artifact "${found.name}" (id: ${found.id}).`);
            } else {
              core.info('No existing discussion-comments artifact found; this may be the first run.');
            }
      
      - name: Download previous comments
        if: ${{ steps.check-artifact.outputs.exists == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: discussion-comments
          path: ./comments
        
      - name: Process comment
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const fs = require('fs');
            const path = require('path');
            
            const commentsDir = path.join(process.cwd(), 'comments');
            if (!fs.existsSync(commentsDir)) {
              fs.mkdirSync(commentsDir, { recursive: true });
            }
            
            const trackingPath = path.join(commentsDir, 'tracking.json');
            let tracking = {};
            if (fs.existsSync(trackingPath)) {
              tracking = JSON.parse(fs.readFileSync(trackingPath, 'utf8'));
            }
            
            const isCommentEvent = context.eventName === 'discussion_comment';
            const subject = isCommentEvent ? context.payload.comment : context.payload.discussion;
            const itemId = subject.id;
            const itemNumber = isCommentEvent ? subject.databaseId : subject.number;
            const currentBody = subject.body;
            const updatedAt = subject.updated_at;
            
            // Restore bot comment only if we already stored the original contents via artifacts
            const trackedEntry = Object.entries(tracking).find(([, botCommentId]) => botCommentId === itemId);
            if (trackedEntry) {
              const [originalId] = trackedEntry;
              const storedOriginalPath = path.join(commentsDir, `${originalId}.json`);
              
              if (fs.existsSync(storedOriginalPath)) {
                const storedData = JSON.parse(fs.readFileSync(storedOriginalPath, 'utf8'));
                const restoreQuery = `
                  mutation UpdateDiscussionComment($commentId: ID!, $body: String!) {
                    updateDiscussionComment(input: {commentId: $commentId, body: $body}) {
                      comment {
                        id
                        databaseId
                        body
                      }
                    }
                  }
                `;
                
                const restoreBody = `<!-- Restored by bot after unauthorized edit | Original Comment ID: ${storedData.number} -->\n\n${storedData.body}`;
                await github.graphql(restoreQuery, { commentId: itemId, body: restoreBody });
                console.log('Restored tracked bot comment from stored artifacts');
              } else {
                console.log('Tracked bot comment edited but no stored artifact was found. Skipping restore.');
              }
              
              return;
            }
            
            const snapshotPath = path.join(commentsDir, `${itemId}.json`);
            const snapshotExistedBefore = fs.existsSync(snapshotPath);
            let previousBody = null;
            
            if (snapshotExistedBefore) {
              const previousData = JSON.parse(fs.readFileSync(snapshotPath, 'utf8'));
              previousBody = previousData.body;
            }
            
            // Always store the latest version for future artifact downloads
            fs.writeFileSync(snapshotPath, JSON.stringify({
              id: itemId,
              number: itemNumber,
              body: currentBody,
              updated_at: updatedAt,
              edited_by: context.actor
            }, null, 2));
            
            const contentChanged = previousBody === null ? true : previousBody !== currentBody;
            if (!contentChanged) {
              console.log('Comment content unchanged, skipping bot reply update.');
              return;
            }
            
            // Only restore contents if they were previously stored in artifacts
            const commentBody = snapshotExistedBefore
              ? `<!-- Restored previous version by @${context.actor} | Comment ID: ${itemNumber} -->\n\n${previousBody}`
              : `<!-- Edited by @${context.actor} | Comment ID: ${itemNumber} -->\n\n${currentBody}`;
            
            if (tracking[itemId]) {
              const updateQuery = `
                mutation UpdateDiscussionComment($commentId: ID!, $body: String!) {
                  updateDiscussionComment(input: {commentId: $commentId, body: $body}) {
                    comment {
                      id
                      databaseId
                      body
                    }
                  }
                }
              `;
              
              await github.graphql(updateQuery, {
                commentId: tracking[itemId],
                body: commentBody
              });
              
              console.log('Updated existing bot comment with stored contents.');
            } else {
              const createQuery = `
                mutation AddDiscussionComment($discussionId: ID!, $body: String!) {
                  addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                    comment {
                      id
                      databaseId
                      body
                    }
                  }
                }
              `;
              
              const result = await github.graphql(createQuery, {
                discussionId: context.payload.discussion.node_id,
                body: commentBody
              });
              
              const createdCommentId = result?.addDiscussionComment?.comment?.id;
              if (!createdCommentId) {
                core.setFailed('Failed to create bot comment: GraphQL response missing comment ID.');
                return;
              }
              
              tracking[itemId] = createdCommentId;
              console.log('Created bot comment for this discussion item and stored it in artifacts.');
            }
            
            fs.writeFileSync(trackingPath, JSON.stringify(tracking, null, 2));
            
      - name: Upload comments as artifact
        uses: actions/upload-artifact@v4
        with:
          name: discussion-comments
          path: ./comments
          retention-days: 30
